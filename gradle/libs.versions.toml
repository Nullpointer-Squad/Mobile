[versions]
agp = "8.11.0"
coilCompose = "2.7.0"
converterGson = "3.0.0"
fragmentKtx = "1.8.8"
hiltVersion = "2.56.2"
hiltCompilerVersion = "2.56.2"
hiltNavigationFragment = "1.2.0"
kotlin = "2.2.0"
coreKtx = "1.16.0"
junit = "4.13.2"
kotlinxCoroutinesAndroid = "1.10.2"
kotlinxCoroutinesCore = "1.10.2"
loggingInterceptor = "5.0.0"
material = "1.12.0"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.9.1"
